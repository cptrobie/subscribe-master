# Deliberately NOT in the base application.yaml — spring.config.import
# resolves as part of processing the document it's declared in, which can
# happen before a *different* file's (profile-specific) properties are
# merged into the environment. Since spring.cloud.vault.token below is
# profile-specific, declaring the import here too means both resolve
# together in the same document, in the right order. Splitting them
# across files caused "Cannot create authentication mechanism for TOKEN"
# even though the token property was correctly set — the import was
# just resolving before it existed. See Spring Boot PR #49324 for the
# underlying Config Data API ordering issue.
spring:
  # Declared here, not in application.yaml, so it resolves *after* the
  # spring.cloud.vault.* connection config below is on the environment
  # (see the longer note just above this block for the full rationale).
  config:
    import: "optional:vault://"

  datasource:
    url: jdbc:postgresql://localhost:5432/subscribe_master
    # username/password intentionally NOT set here — pulled from Vault at
    # secret/subscribe-master (see application.yaml). Populate before first
    # run with:
    #
    #   vault kv put secret/subscribe-master \
    #     spring.datasource.username=subscribe_master \
    #     spring.datasource.password=local_dev_only_not_a_real_secret
    #
    # (matching the credentials already in compose.yaml). Without
    # this, the app will fail to start — Vault's dev-mode container starts
    # empty; nothing is seeded into it automatically.

  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      authentication: TOKEN
      # Same throwaway dev-mode root token as compose.yaml. Safe to
      # default here for the same reason it's safe there — see
      # ARCHITECTURE.md §9 for why this pattern is dev-only, never prod.
      token: ${VAULT_TOKEN:local-dev-root-token}

logging:
  level:
    org.springframework.vault: DEBUG
    org.springframework.cloud.vault: DEBUG