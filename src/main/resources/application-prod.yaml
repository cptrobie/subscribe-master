# Deliberately NOT in the base application.yaml — spring.config.import
# resolves as part of processing the document it's declared in, which can
# happen before a *different* file's (profile-specific) properties are
# merged into the environment. Since the AppRole connection config below
# is profile-specific, declaring the import here too means both resolve
# together in the same document, in the right order. See
# application-dev.yaml for the fuller explanation and the original bug
# this fixed (Spring Boot PR #49324, a Config Data API ordering issue).
#
# Deliberately NOT prefixed with "optional:" here, unlike dev — a
# missing/unreachable Vault in production should fail the app outright
# at startup, not silently boot without real secrets and fail later
# with a confusing, disconnected error (e.g. the datasource connection
# failing with no obvious link back to Vault being the actual cause).
spring:
  # Resolves after the AppRole connection config below is on the
  # environment (see the note just above this block for the full
  # rationale, and application-dev.yaml for the original bug details).
  config:
    import: "vault://"

  datasource:
    url: ${DATASOURCE_URL}
    # username/password pulled from Vault (see application.yaml's kv config)
    # — never set here, and never given a fallback default the way dev's
    # token is. If any of these env vars are missing, startup should fail
    # loudly rather than silently falling back to something insecure.

  cloud:
    vault:
      host: ${VAULT_HOST}
      port: ${VAULT_PORT:8200}
      scheme: https
      # AppRole, not a static token — a prod service authenticates itself
      # to Vault with its own role/secret ID pair (typically injected by
      # whatever orchestrates deployment), not a long-lived shared token.
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id: ${VAULT_SECRET_ID}

logging:
  level:
    root: WARN
    org.springframework.vault: WARN