name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # No manually-configured Postgres/Vault services here — deliberately.
    # SubscribeMasterApplicationIT provisions its own throwaway Postgres
    # and Vault via Testcontainers, and GitHub's ubuntu-latest runners
    # have Docker pre-installed, so Testcontainers works natively with
    # zero extra setup. Running manually-configured services *and*
    # Testcontainers together would just be two overlapping sets of
    # containers doing redundant work.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests (unit + integration)
        # mvn verify runs the full lifecycle proven locally: Surefire runs
        # every unit test (AuthServiceTest, etc. — no infrastructure
        # needed), then Failsafe runs SubscribeMasterApplicationIT and
        # AuthControllerIT during integration-test/verify — both provision
        # their own Postgres (and, for SubscribeMasterApplicationIT, Vault
        # too) via Testcontainers, migrate the schema with Flyway, and
        # validate it with Hibernate. Same command, same result as running
        # it locally — nothing CI-specific needed.
        #
        # SubscribeMasterApplicationTests (an infra-free smoke test) was
        # deleted once real JPA-repository-backed beans entered the
        # application's core wiring, making "full context, zero database"
        # structurally impossible — SubscribeMasterApplicationIT is now
        # the sole context-boot verification.
        run: ./mvnw -B verify
